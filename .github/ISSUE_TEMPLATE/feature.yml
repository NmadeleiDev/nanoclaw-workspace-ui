name: Feature idea
description: Describe a workflow you want to improve
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe your workflow and the current obstacle.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behavior
      description: Include alternatives or examples if useful.
