name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: addon
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nanocoai/nanoclaw
          ref: acc2b1c8f52a954368cfaf04b61c32f9a1efc280
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install upstream dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile
      - name: Audit package and exercise installer
        working-directory: addon
        env:
          WORKSPACE_UI_UPSTREAM: ${{ github.workspace }}/upstream
        run: |
          node release.mjs --check
          node --test tests/*.test.mjs
          node install.mjs --target ../upstream --check
          node install.mjs --target ../upstream --apply
      - name: Resolve add-on dependencies under upstream policy
        working-directory: upstream
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
      - name: Build and test
        working-directory: upstream
        run: |
          pnpm run build
          pnpm run workspace:build
          pnpm exec vitest run src/modules/workspace-ui src/model-connections.test.ts src/agent-configuration-admission.test.ts src/atomic-file.test.ts web/workspace/tests
      - name: Build reproducible release
        working-directory: addon
        run: node release.mjs --build
